[project]
name = "aiomultiprocess-loadtest"
version = "0.1.0"
description = "Example of async only vs aiomultiprocess"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiohttp",
    "aiomultiprocess",
    "asyncpg",
    "httpx",
    "sanic",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.uv]
package = false
